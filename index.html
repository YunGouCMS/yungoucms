<script>
    function isMobile() {
        const userAgentInfo = navigator.userAgent;
        const mobileAgents = ["Android", "iPhone", "SymbianOS", "Windows Phone", "iPad", "iPod"];
        const mobileFlag = mobileAgents.some((mobileAgent) => {
            return userAgentInfo.indexOf(mobileAgent) > 0;
        });
        return mobileFlag;
    }
    if (isMobile()) {
        window.location.href = '/index/'
    }
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/app/index/init', true);
    xhr.onreadystatechange = function () {
        if (xhr.status == 200) {
            var datajson = JSON.parse(xhr.responseText).data.config;
            console.log(datajson.web_name);
            var element = document.querySelector('.title');
            element.innerHTML = datajson.web_name;
            document.title = datajson.web_name;
        }
    };
    xhr.send();
