<!DOCTYPE html>
<html>
<head>
<meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
<title>{wc:$webname}</title>
<meta content="app-id=518966501" name="apple-itunes-app" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no, maximum-scale=1.0, target-densitydpi=medium-dpi" />
<meta content="yes" name="apple-mobile-web-app-capable" />
<meta content="black" name="apple-mobile-web-app-status-bar-style" />
<meta content="telephone=no" name="format-detection" />
<link href="{G_TEMPLATES_CSS}/mobile/comm.css" rel="stylesheet" type="text/css" />
<script src="{G_TEMPLATES_JS}/mobile/jquery190.js" language="javascript" type="text/javascript"></script>
<style>
.linkbox{height:77px;padding-top:15%;}
.linkbox li{float:left;}
html body{overflow-x: hidden;width: 100%;}
.m_mobile{display: inline-block;width:100%;height:100%;background: url("{G_TEMPLATES_IMAGE}/mobile/sug-tel-icon.png") no-repeat scroll 34% 0 / 110% auto;}
.m_qq{margin-right: 2px;display: inline-block;width:100%;height:100%;background: url("{G_TEMPLATES_IMAGE}/mobile/sug-qq-icon.png") no-repeat scroll -4px 0 / 113% auto;}
.m_weixin{display: inline-block;width:100%;height:100%;background: url("{G_TEMPLATES_IMAGE}/mobile/sug-weixin-icon.png") no-repeat scroll -1px 0 / 106% auto;}
.articles{background-color: white;margin-top: 11px;display: block;line-height: 15px;}
.link{background-color: white;text-align: center;padding-top: 3%;padding-bottom:1.5%;width:100%;}
.link-item{text-align:left;cursor:pointer;padding: 3px;display: inline-block;width: 30%;background-color: #f2fffb ;height: 25%;}
.articles-item{padding: 12px;}
.des{display: inline-block;float:right;font-size: 10px;}
.des-content{color: #bbb;float: left;display: inline-block;padding-right: 6px;}
.arrow{float: right;color: #bbb;display: inline-block;width: 7px;height: 16px;background-image: url({G_TEMPLATES_IMAGE}/mobile/m_set.png);background-size:35px auto;background-position: -5px -127px;}
.body{background-color:#F7F7F7;}
.article{font-size: 13px;}
.linkbox s{margin-top: 2%;margin-right:1%;margin-left: 0;}
.descri{margin-top: 10px;}
a:visited{color: black;}
.weixin-img{display: none;width: 50%;position: fixed;top: 20%;text-align: center;z-index: 100;max-width: 640px;background: #fff;box-sizing: border-box;left: 25%;}
.weixin-img div{font-size: 14px;background: #f2f2f2;width: 100%;margin: 0 auto;height: 36px;line-height: 36px;}
.weixin-img img{width: 100%;height: auto;}
.mask{display: none;position: absolute;top:0;left: 0;width: 100%;background-color: black;opacity: 0.5;z-index: 99;}
.logo{width: 28%;height: 63%;}
.linkbox .des{width:72% ;}
/*客服微信*/
.scwz {width: 100%;height: 100%;position: fixed;z-index: 999;top: 0;left: 0;bottom: 0;right: 0;background:rgba(0, 0, 0, 0.48);z-index: 9999;}
.mint-popup-wechat {border-radius: 8px;width: 100%;line-height: 0;background: none;top: 40%;text-align: center;max-width: 750px;}
.mint-popup {position: fixed;top: 41%;left: 50%;-webkit-transform: translate3d(-50%,-50%,0);transform: translate3d(-50%,-50%,0);    -webkit-backface-visibility: hidden;backface-visibility: hidden;transition: .2s ease-out;}
.close {width: 40px;height: 40px;position: relative;display: block;border: 2px solid #fff;border-radius: 50%;left: 50%;margin-left: -20px;top: 20px;}
.close::after, .close::before {content: "";position: absolute;top: 50%;left: 50%;margin-left: -1rem;width: 2rem;height: 2px;background-color: #fff;    -webkit-transform: rotate(45deg);transform: rotate(45deg);}
.close::after {-webkit-transform: rotate(-45deg);transform: rotate(-45deg);}
.orange,.Progress-bar .Pro-bar-li li.P-bar01 em,.Progress-bar .Pro-bar-li li.P-bar03 em {color: {THEME_COLOR};}a.orgBtn,.u-progress .pging,.haveNot .guangguang,#addAll,#addAll p {background: {THEME_COLOR};}#addAll {box-shadow: 0 0 15px {THEME_COLOR};}
</style>
</head>
<body>
<div class="link">
  <div onClick="location.href='tel:{wc:$info['cell']}'" class="link-item">
    <ul class="linkbox">
      <li class="logo"><s class="m_mobile"></s></li>
      <li class="des">
        <div class="descri">客服电话</div>
        <div> {wc:$info['cell']}</div>
      </li>
    </ul>
  </div>
  <div onClick="location.href='http://wpa.qq.com/msgrd?v=3&uin={wc:$info['qq']}&site=qq&menu=yes'" class="link-item">
    <ul class="linkbox">
      <li  class="logo"><s class="m_qq"></s></li>
      <li class="des">
        <div class="descri">客服QQ</div>
        <div>{wc:$info['qq']}</div>
      </li>
    </ul>
  </div>
  <a onClick="sck()" id="aPublic"><div class="link-item">
    <ul class="linkbox">
      <li class="logo"><s class="m_weixin"></s></li>
      <li class="des">
        <div class="descri">客服微信</div>
        <div>{wc:$info['wxcode']}</div>
      </li>
    </ul>
  </div></a>
</div>
<div class="articles"> {wc:loop $data $a}
  <div class="articles-item"> <a href="/mobile/mobile/gonggaoxq/{wc:$a['id']}"><span class="article">{wc:$a['title']}</span><span class="des"><span class="des-content">{wc:$a['description']}</span> <span class="arrow"></span></span></a> </div>
  {wc:loop:end} </div>

<!-- 关注我们 -->
<script src="/pay/tehui/yong/js/index_tab.js" language="javascript" type="text/javascript"></script>
<div class="scwz" id="scwz" style="z-index: 2033; display:none;" onclick="scg()">
  <div class="mint-popup mint-popup-wechat"><img src="{G_UPLOAD_PATH}/{wc:$wxkfewm}" style="width: 70%; height: auto; display: inline-block;"></div>
</div>
<script  type="text/javascript">
$(document).ready(function(){
    if(document.referrer!=""){
        $("#buy-container").hide();
    }
  $("#buy-container").click(function(){
    $(this).hide();
  });
});
</script>

{wc:templates "mobile/index","footer"}
</div>
</body>
</html>
