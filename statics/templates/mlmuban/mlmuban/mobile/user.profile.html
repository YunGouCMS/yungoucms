<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no, maximum-scale=1.0"/>
<title>修改昵称</title>
<meta content="yes" name="apple-mobile-web-app-capable" />
<meta content="black" name="apple-mobile-web-app-status-bar-style" />
<meta content="telephone=no" name="format-detection" />
<link href="{G_TEMPLATES_CSS}/mobile/comm.css" rel="stylesheet" type="text/css" />
<script src="{G_TEMPLATES_JS}/mobile/jquery190.js" language="javascript" type="text/javascript"></script>
<style>
/*==========以下部分是Validform必须的===========*/
.Validform_checktip {margin-left: 8px;line-height: 20px;height: 20px;overflow: hidden;color: #999;font-size: 12px;}
.Validform_right {color: #71b83d;padding-left: 20px;background: url({G_TEMPLATES_IMAGE}/mobile/right.png) no-repeat left center;}
.Validform_wrong {color: red;padding-left: 20px;white-space: nowrap;background: url({G_TEMPLATES_IMAGE}/mobile/error.png) no-repeat left center;}
.Validform_loading {padding-left: 20px;background: url(/statics/templates/ffxiang/img/onLoad.gif) no-repeat left center;}
.Validform_error {background-color: #ffe7e7;}
#Validform_msg {color: #7d8289;font: 12px/1.5 tahoma, arial, \5b8b\4f53, sans-serif;width: 280px;-webkit-box-shadow: 2px 2px 3px #aaa;-moz-box-shadow: 2px 2px 3px #aaa;background: #fff;position: absolute;top: 0px;right: 50px;z-index: 99999;display: none;filter: progid:DXImageTransform.Microsoft.Shadow(Strength=3, Direction=135, Color='#999999');}
#Validform_msg .iframe {position: absolute;left: 0px;top: -1px;z-index: -1;}
#Validform_msg .Validform_title {line-height: 25px;height: 25px;text-align: left;font-weight: bold;padding: 0 8px;color: #fff;position: relative;background-color: #666;}
#Validform_msg a.Validform_close:link, #Validform_msg a.Validform_close:visited {line-height: 22px;position: absolute;right: 8px;top: 0px;color: #fff;text-decoration: none;}
#Validform_msg a.Validform_close:hover {color: #cc0;}
#Validform_msg .Validform_info {padding: 8px;border: 1px solid #666;border-top: none;text-align: left;}
li.acc {padding-top: 20px;border-bottom: 1px solid #ccc;}
.registerCon li {margin: 10px 10%;}
.registerCon li label {letter-spacing: 10px;padding-right: 10px;}
.registerCon li label, .registerCon li input.txt {color: #000;font-size: 16px;}
.registerCon li input.txt {display: inline-block;height: 40px;width: 70%;}
input.orgBtn {margin-top: 20px;}
.main-content{margin-top: 2.9rem;}
input.orgBtn,a.orgBtn,.u-progress .pging,.haveNot .guangguang,#addAll,#addAll p {background-color: {THEME_COLOR};}
input.orgBtn {border: 1px solid {THEME_COLOR};}
.orange,.Progress-bar .Pro-bar-li li.P-bar01 em,.Progress-bar .Pro-bar-li li.P-bar03 em {color: {THEME_COLOR};}#addAll {box-shadow: 0 0 15px {THEME_COLOR};}
</style>
</head>
<script type="text/javascript" src="{G_TEMPLATES_JS}/mobile/jquery.Validform.min.js"></script>

<script type="text/javascript">
        $(function () {
            var demo = $(".registerCon").Validform({
                tiptype: 2,
                datatype: {
                    "tel": /([a-z][A-Z][0-9])+/,
                    "nic": /^[A-Za-z0-9_\u4e00-\u9fa5]{2,5}$/,
                },
            });
            demo.tipmsg.w["tel"] = "请正确输入电话号码(区号、号码必填，用“-”隔开)";
            demo.tipmsg.w["nic"] = "昵称为汉字、字母、数字、“_”字符组成";
            demo.addRule([
                {
                    ele: "#nicxx",
                    datatype: "nic",
                },
                {
                    ele: "#txt_ship_tel",
                    datatype: "tel",
                }]);
        });
    </script>

<body>
<div class="h5-1yyg-v11">
  <div class="main-content clearfix">
    <section style="padding-top: 0px;">
      <div class="registerCon">
        <ul class="form">
		  <li class="acc">
                    <label for="nicxx">昵称</label>
                    <input id="nicxx" datatype="nic" nullmsg="昵称为汉字、字母、数字组成" name="username" value="{wc:$member['username']}" type="text" class="txt" maxlength="20">
                </li>
		  <li>
            <input name="submit" type="submit" id="btnSave" class="orgBtn" value="保存">
            <span class="Validform_checktip"></span></li>
        </ul>
      </div>
    </section>
    <script>
$(function(){
var b = function() {
var submiting = false;
var $username = $('input[name=username]');
var $qianming = $('input[name=qianming]');
$('#btnSave').click(function(){
if (submiting) {
return false;
}
var post = {
username : $username.val(),
qianming : $qianming.val()
};
if ( post.username == '' ) {
$.PageDialog.fail("昵称不能为空哦");
return false;
}

var the = $(this).text('正在提交');
submiting = true;
$.post("{WEB_PATH}/mobile/user/profilechange",post,function(s){
if (s==1) {
$.PageDialog.ok('保存成功！', function(){
window.location.href="{WEB_PATH}/mobile/home";
});
} else {
submiting = false;
the.text('保存');
$.PageDialog.fail(s);
}
},'text');
});
};
var a = function() {
Base.getScript(Path.Skin + "/js/mobile/pageDialog.js", b);
};
Base.getScript(Path.Skin + "/js/mobile/comm.js", a);
});
</script>
  </div>
  {wc:templates "mobile/index","footer"}
  <script language="javascript" type="text/javascript">
  var Path = new Object();
  Path.Skin="{G_TEMPLATES_STYLE}";  
  Path.Webpath = "{WEB_PATH}";
  Path.imgpath = "{G_WEB_PATH}/statics";
  
var Base={head:document.getElementsByTagName("head")[0]||document.documentElement,Myload:function(B,A){this.done=false;B.onload=B.onreadystatechange=function(){if(!this.done&&(!this.readyState||this.readyState==="loaded"||this.readyState==="complete")){this.done=true;A();B.onload=B.onreadystatechange=null;if(this.head&&B.parentNode){this.head.removeChild(B)}}}},getScript:function(A,C){var B=function(){};if(C!=undefined){B=C}var D=document.createElement("script");D.setAttribute("language","javascript");D.setAttribute("type","text/javascript");D.setAttribute("src",A);this.head.appendChild(D);this.Myload(D,B)},getStyle:function(A,B){var B=function(){};if(callBack!=undefined){B=callBack}var C=document.createElement("link");C.setAttribute("type","text/css");C.setAttribute("rel","stylesheet");C.setAttribute("href",A);this.head.appendChild(C);this.Myload(C,B)}}
function GetVerNum(){var D=new Date();return D.getFullYear().toString().substring(2,4)+'.'+(D.getMonth()+1)+'.'+D.getDate()+'.'+D.getHours()+'.'+(D.getMinutes()<10?'0':D.getMinutes().toString().substring(0,1))}
Base.getScript('{G_TEMPLATES_JS}/mobile/Bottom.js?v='+GetVerNum());
</script>
</div>
</body>
</html>
