<!DOCTYPE html>
<html>
<head>

<title>密码修改</title>
<meta content="yes" name="apple-mobile-web-app-capable" />
<meta content="black" name="apple-mobile-web-app-status-bar-style" />
<meta content="telephone=no" name="format-detection" />
<link href="{G_TEMPLATES_CSS}/mobile/comm.css" rel="stylesheet" type="text/css" />
<link href="{G_TEMPLATES_CSS}/mobile/password.css" rel="stylesheet" type="text/css" />
<script src="{G_TEMPLATES_JS}/mobile/jquery190.js" language="javascript" type="text/javascript"></script>
</head>
<style>
        .row{
            display: flex;
            width: 94%;
            margin: 6px auto;
            justify-content: space-between;
            align-content: center;
            color:#a5a5a5;
            flex-direction: column;
        }
        .row:last-child{
            border: none;
        }
        .row input{
            background: none;
            height: 36px;
            color: #000;
            border-bottom:1px solid #e6e6e6;
            font-size: 14px;
            flex-grow: 2;
            margin: 4px 0px;
        }
        .row input:focus{
            border-bottom: 1px solid #ed9d00;
        }
        .row .tip{
            font-size: 16px;
            color: #000;
        }
        .row button{
            border: none;
            color: #fff;
            height: 30px;
            border-radius: 20px;
            padding: 0 10px;
            cursor: pointer;
            /* width: 80px;*/
            margin-left: 8%;
        }
		 #btnSave{
            width: 100%;
            height: 43px;
            margin-top: 20px;
            margin-left: 0;
            font-size: 18px;
        }
 		 .row .row_box{
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }
        .row button {background: {THEME_COLOR};}
</style>
<body>
  
  
  
  
<div class="h5-1yyg-v11">
  <!-- 栏目页面顶部 -->
  <section style="margin-top: 36px;">
    <div class="row">
            <span class="tip" style="font-size:12px">如果您还没有设置过密码，请使用初始密码: 123456</span>
        </div>
        <div class="row">
            <span class="tip">原密码:</span>
            <input class="password" id="password1" name="pwd1" placeholder="请输入您的原密码">
        </div>
        <div class="row">
            <span class="tip">新密码:</span>
            <input class="password" id="password2" name="pwd2" placeholder="请输入您的新密码">
        </div>
     <div class="row">
            <span class="tip">新密码:</span>
            <input class="password" id="password1" name="pwd3" placeholder="请重复输入您的新密码">
        </div>
        <div class="row">
            <button id="btnSave">
                确认
            </button>
        </div>
    </section>

 <script>
$(function(){
var b = function() {
var submiting = false;
var pwd1 = $('input[name=pwd1]');
var pwd2 = $('input[name=pwd2]');
var pwd3 = $('input[name=pwd3]');
$('#btnSave').click(function(){
if (submiting) {
return false;
}
var post = {
pwd1 : pwd1.val(),
pwd2 : pwd2.val(),
pwd3 : pwd3.val()
};
if ( post.pwd1 == '' ) {
$.PageDialog.fail("原密码不能为空哦");
return false;
}
if ( post.pwd2 == '' ) {
$.PageDialog.fail("新密码不能为空哦");
return false;
}
if ( post.pwd2 != post.pwd3 ) {
$.PageDialog.fail("两次新密码输入不一致哦");
return false;
}
if ( post.pwd2.length < 6 || post.pwd2.length > 20) {
$.PageDialog.fail("密码长度为6-20个字符！");
return false;
}
var the = $(this).text('正在提交');
submiting = true;
$.post("{WEB_PATH}/mobile/user/userpassword",post,function(s){
if (s=='ok') {
$.PageDialog.ok('修改成功！', function(){
window.location.href="{WEB_PATH}/mobile/home";
});
} else {
submiting = false;
the.text('修改');
$.PageDialog.fail(s);
}
},'text');
});
};
var a = function() {
Base.getScript(Path.Skin + "/js/mobile/pageDialog.js", b);
};
Base.getScript(Path.Skin + "/js/mobile/comm.js", a);
});
</script>
    <script>
(function() {
if (!$){
return;
}
var bb = 80;
var b = $("#btnTop");
if ($(window).scrollTop() == bb) {
b.hide()
}
b.css("zIndex", "99").click(function() {
$("body,html").animate({
scrollTop: 0
},300);
});
$(window).scroll(function() {
if ($(this).scrollTop() > bb) {
b.fadeIn();
} else {
b.fadeOut();
}
});
})();
</script>
