<!DOCTYPE html>
<html>
<head >
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
<title>{wc:$string}</title>
<meta content="app-id=518966501" name="apple-itunes-app" />
<meta content="yes" name="apple-mobile-web-app-capable" />
<meta content="black" name="apple-mobile-web-app-status-bar-style" />
<meta content="telephone=no" name="format-detection" />
<link href="{G_TEMPLATES_CSS}/mobile/comm.css" rel="stylesheet" type="text/css" />
<link href="{G_TEMPLATES_CSS}/mobile/cartList.css" rel="stylesheet" type="text/css" />
<style>.orange,.Progress-bar .Pro-bar-li li.P-bar01 em,.Progress-bar .Pro-bar-li li.P-bar03 em {color: {THEME_COLOR};}a.orgBtn,.u-progress .pging,.haveNot .guangguang,#addAll,#addAll p {background: {THEME_COLOR};}#addAll {box-shadow: 0 0 15px {THEME_COLOR};}</style>
</head>
<script>
function locahost(){
    {wc:if $defurl == ':js:'}window.history.back();{wc:else}location.href="{wc:$defurl}";{wc:if:end}
}

    function closeWindow(){window.open('', '_self', '');window.close();}

var i = {wc:$time}; if(i!=0){window.close_id = setInterval(function() {if (i > 0) {document.getElementById('time').innerHTML = i;i = i - 1;} else {
        locahost();clearInterval(window.close_id);}}, 1000);}
        </script>
<body>
<div class="h5-1yyg-v1">
  <div class="g-pay-auto" style="padding-top: 0px;color: #999;position: absolute;
        top: 35%;
        left: 50%;
        -ms-transform: translate(-50%,-35%);
        -moz-transform: translate(-50%,-35%);
        -o-transform: translate(-50%,-35%);
        transform: translate(-50%,-35%); ">
    <div class="z-pay-tips" style="display: block;margin:0 auto;height: 70px;font-size: 16px;font-weight: 600;width: 100%;color: #666;text-align: center;line-height: 30px;"> {wc:$string} </div>
    <font id="time" style="color:red;">{wc:$time}</font>&nbsp;&nbsp;秒后返回上一页面 </div>
  {wc:templates "mobile/index","footer"} </div>
</body>
</html>
