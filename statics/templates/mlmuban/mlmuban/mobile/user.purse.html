<script type='text/javascript'>
    $(function(){
        var popupPage = $('.popup')
        var modal = $('.modal')
        var btn_c = $('.btn-confirm')
        $('.van-row .van-col:first-child').click(function(){
            modal.fadeIn()
            popupPage.show();   
            popupPage.animate({left:'0px'},300);
        })
        $('.van-row .van-col:nth-child(2)').click(function(){
            location.href = '/mobile/invite/cashout'
        })      
        $('.closeBtn').click(function(){
            modal.fadeOut()
            popupPage.animate({left:'101%'},300,function(){
                $(this).hide();
            });
        })
        $('.price_right').click(function(){
            if ($(this).val('') <= 0 ) {$.PageDialog.fail("请输入整数~");$(this).val('');return}
            $('.price_input_text input').val(0)
            btn_c.removeClass('btn-disable').addClass('btn-default');
        })
        $('.price_input_text input').on("input propertychange",function(){
            if( $(this).val() <= 0 ) {$.PageDialog.fail("请输入整数~");$(this).val('');btn_c.removeClass('btn-default').addClass('btn-disable');return}
            if( $(this).val() > 0 ){btn_c.removeClass('btn-disable').addClass('btn-default');} 
			else {
			btn_c.removeClass('btn-disable').addClass('btn-default');
			} 
           
        })
        $('.btn-confirm').click(function(){
            if($(this).hasClass('btn-disable')) return
            $(this).addClass('btn-disable');
            var money = $('.price_input_text input').val();
            $.post('/mobile/home/pursetomoney', {'money':money}, function(d){
                if(d == 0) {$.PageDialog.ok("转入成功!赠送" + Math.floor(money*0.02) + "元");setTimeout(function(){location.href='/mobile/home/purse'},2000)}
                else $.PageDialog.fail("操作失败!")
            })
        })      
        $('.cell-group .cell').click(function(){
            var i = $(this).index()
            if(i == 0) location.href='{WEB_PATH}/mobile/home/userrecharge'
            else if(i == 1) location.href='{WEB_PATH}/mobile/invite/record'
            else if(i == 2) location.href='{WEB_PATH}/mobile/invite/friends'
        })
        Base.getScript(Path.Skin + "/js/mobile/pageDialog.js");
    }); 

</script>
