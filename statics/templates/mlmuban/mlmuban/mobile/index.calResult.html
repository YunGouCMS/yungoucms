<html>
<head>

</head>
  <style>
  #lot {
			width: 100%;
			padding: 10px;
			margin-bottom: 20px;
			background: #FFFDDD;
			box-sizing: border-box;
		}

		.z-minheight #lot {
			margin-bottom: 0;
		}

		#lot .viewTicket {
			display: block;
			width: 15rem;
			height: 2rem;
			background: #e70012;
			margin: 10px auto 0;
			border-radius: 15px;
			color: #FFF;
			line-height: 2rem;
			text-align: center;
		}

		#lot ul {
			text-align: center;
		}

		#lot ul:after {
			content: '';
			display: block;
			width: 100%;
			height: 0;
			overflow: hidden;
			clear: both;
		}

		#lot li {
			height: 32px;
			list-style: none
		}

		#lot li dt, #lot li dd {
			width: 100%;
			height: 16px;
			line-height: 16px;
		}

		#lot  dl {
			float: left;
			border: 1px solid #e70012;
			background: #FFF;
			box-sizing: border-box;
			border-radius: 15px;
		}

		#lot li dt {
			font-size: 12px;
		}

		#lot li dd {
			font-size: 10px;
		}

		#lot li dt {
			color: #e70012
		}

		#lot li dd {
			color: #bbb
		}

		#lot li em {
			float: left;
			width: 5%;
			height: 32px;
			line-height: 32px;
			color: #e70012;
			font-size: 16px;
			font-style: normal;
		}

		#lot li:first-child {
			position: relative;
			margin-bottom: 18px;
		}

		#lot li:first-child:after {
			content: '=';/*\21E7*/
			display: block;
			position: absolute;
			width: 4px;
			height: 10px;
			top: 34px;
			left: calc(22.5% + 2px);
			color: #e70012;
			font-size: 16px;
			-webkit-transform: rotate(90deg);
		}

		#lot li:first-child dl {
			width: 23%;
		}

		#lot li:first-child dl:first-of-type {
			width: 30%;
		}

		#lot li:first-child dl:nth-of-type(2) {
			width: 27%;
			background: #e70012;
		}

		#lot li:first-child dl:nth-of-type(2) * {
			color: #FFF;
		}

		#lot li:last-child dl {
			width: 25%
		}

		#lot li:last-child dl:first-of-type {
			margin-left: 10%;
		}

		#lot li:last-child em:first-of-type {
			width: 5%
		}

		#lot li:nth-child(2) em:nth-of-type(2) {
			width: 10%
		}

		#lotCode {
			position: fixed;
			width: calc(100% - 48px);
			height: 75px;
			top: 71px;
			left: 24px;
			color: #e70012;
			background: #e4e4e4;
			text-align: center;
			border-radius: 5px;
			opacity: 1;
			-webkit-transform: scale(1);
			-webkit-animation: lottering ease-in 3s;
			-webkit-animation-fill-mode: forwards;
			z-index: 111;
		}

		#lotCode p:first-child {
			font-size: 25px;
			line-height: 50px
		}

		#lotCode p:last-child {
			font-size: 14px;
			line-height: 20px
		}
		@-webkit-keyframes lottering {
		66.6% {
			-webkit-transform: scale(1);
			top: 71px;
		}

		99.9% {
			opacity: 1;
		}

		100% {
			-webkit-transform: scale(.2);
			top: 170px;
			opacity: 0;
		}
	}
	.orange,.Progress-bar .Pro-bar-li li.P-bar01 em,.Progress-bar .Pro-bar-li li.P-bar03 em {color: {THEME_COLOR};}	a.orgBtn,.u-progress .pging,.haveNot .guangguang,#addAll,#addAll p {background: {THEME_COLOR};}	#addAll {box-shadow: 0 0 15px {THEME_COLOR};}
  </style>
<body>
<div class="h5-1yyg-v1">
  <!-- 栏目页面顶部 -->
  <!-- 内页顶部 -->
  <input name="hidCodeID" type="hidden" id="hidCodeID" value="{wc:$item['id']}" />
  <input name="hidRaffleTime" type="hidden" id="hidRaffleTime" value="{wc:fun:microt($item['q_end_time'])}" />
  <input name="hidBaseNum" type="hidden" id="hidBaseNum" value="{wc:$user_shop_time_add}" />
  <input name="hidCodeQuantity" type="hidden" id="hidCodeQuantity" value="{wc:$item['canyurenshu']}" />
  <input name="hidYuShu" type="hidden" id="hidYuShu" value="{wc:$user_shop_fmod}" />
  <input name="hidExternalCode" type="hidden" id="hidExternalCode" value="{wc:$item['q_external_code']}" />
  <input name="hidEndCounttime" type="hidden" id="hidEndCounttime" value="{wc:$item['q_end_counttime']}" />
  <input name="hidExternalTime" type="hidden" id="hidExternalTime" value="{wc:$external_time}" />
  <input name="hidCodeRno" type="hidden" id="hidCodeRno" value="{wc:$item['q_user_code']}" />
  <input name="ssc" type="hidden" id="ssc" value="{wc:$item['ssc']}" />
  <section id="calResult" class="z-minheight" style="padding-top: 0px;">
    <div id="divGoodsLoading" class="loading loading2"><b></b>正在加载</div>
  </section>
  {wc:templates "mobile/index","footer"}

function GetVerNum(){var D=new Date();return D.getFullYear().toString().substring(2,4)+'.'+(D.getMonth()+1)+'.'+D.getDate()+'.'+D.getHours()+'.'+(D.getMinutes()<10?'0':D.getMinutes().toString().substring(0,1))}
