  <script src="{G_TEMPLATES_JS}/mobile/clipboard.min.js"></script>
<script>
    var clip = null;
    $.post("{WEB_PATH}/mobile/invite/mycode_new",function(s){
			var sdata = JSON.parse(s)
		    $('#btnQRCode').attr("href",JSON.parse(s).data);
		});
    function copy(id){ return document.getElementById(id); }
    function initx(){
        clip = new ZeroClipboard.Client();
        clip.setHandCursor(true);
        ZeroClipboard.setMoviePath("{G_TEMPLATES_STYLE}/js/ZeroClipboard.swf");
        clip.addEventListener('mouseOver',function (client){
            clip.setText(copy('txtInfo').value );
        });
        clip.addEventListener('complete',function(client,text){
            alert("邀请复制成功");
        });
        clip.glue('d_clip_button','d_clip_container');
    }
    $(function(){
        initx();
         
    })

	
	
	  $('#toggle_secret').click(function (e) {
            var elm = $(this),
                secretElm = $('.secret');

            elm.toggleClass(function () {
                if (!elm.hasClass('hide'))
                    secretElm.html('****');
                else {
                    secretElm.each(function (e) {
                        var x = $(this),
                            secret = x.data('secret');

                        x.html(secret);
                    })
                }

                return "hide";
            })
        });
		 $("#btnQRCode").fancybox({
            openEffect  : 'none',
            closeEffect	: 'none',
            closeClick : true
        });
$(function(){
	$.getJSON('http://m.hi5080.cn/app/home/getShortUrl', function(data) {
        		if (data.code > 0) {
        			$.PageDialog.fail(data.code_msg);
        		}
        		if (data.url_short) {
	        		$('#url-short').html(data.url_short);
	                var clipboard = new Clipboard('#copyUrl', {
	                    text: function() {
	                        return data.url_short;
	                    }
	                });
	                clipboard.on('success', function() {
	                    layer.msg("复制成功!");
	                });
        		}
        	});
});
