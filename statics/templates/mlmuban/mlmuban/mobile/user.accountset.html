<script type="text/javascript">
    $(function () {
        var data = {
            file: {},
            blob: {}
        };
		//头像
        $('#touimg').change(function () {
            lrz(this.files[0], {width: 200,height:200}, function (results) {
                data.file = results.origin;
                data.blob = results.blob;
                upload_img(function (file) {
                    $("#userimg").attr("src",getOSSImage_50(file));
                });
            });
        });

        function upload_img(callback) {
            var xmlhttp = $.ajax({
                url: '{WEB_PATH}/index.php/mobile/ajax/userimg_before/',
                type: "POST",
                data: {"filename": data.file.name},
                async: false
            });
            var response = xmlhttp.responseText;
            var obj = eval("(" + response + ")");
            if (obj.state == 'SUCCESS') {
                var formData = new FormData();
                formData.append('key', obj.key);
                formData.append('policy', obj.policy);
                formData.append('OSSAccessKeyId', obj.accessid);
                formData.append('success_action_status', '200'); //让服务端返回200,不然，默认会返回204
                formData.append('callback', obj.callback);
                formData.append('signature', obj.signature);
                formData.append('file', data.blob);
                $.ajax({
                    url: 'http://dyyyyg.oss-cn-shenzhen.aliyuncs.com',
                    type: 'POST',
                    dataType: 'json',
                    cache: false,
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function (json) {
                        callback(json.object);
                    }
                });
            } else {
                alert(obj.state);
            }
        }

        $("[role='tab']").click(function () {
            var target = $(this).attr('target');
            $(target).toggleClass('active');
        });

        var elems = Array.prototype.slice.call(document.querySelectorAll('.ios-switch>input'));
        elems.forEach(function(html) {
            new Switchery(html);
             $(html).change(function () { 
                 var _type = $(this).data('privacy-type'); 
                 var _status = $(this).is(":checked") ? "4" : "0";              
                     if(_status == '0' ){ 
                         $(this).siblings('label').text('仅自己可见'); 
                     } else { 
                         $(this).siblings('label').text('所有人可见'); 
                     } 
                     $.post("{WEB_PATH}/mobile/mobile/userPrivacy",{type: _type,status:_status},function (data) { 
                         if(data != 'ok') { 
                               $.PageDialog.ok("更新失败！");
                        }else{
                           
                             $.PageDialog.ok("更新成功！");   
                        } 
                     }); 
            }); 
        });
    });
</script>
