<!DOCTYPE html>
<html>
<head>
<title>绑定手机</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no, maximum-scale=1.0"/>
<meta content="yes" name="apple-mobile-web-app-capable" />
<meta content="black" name="apple-mobile-web-app-status-bar-style" />
<meta content="telephone=no" name="format-detection" />
<link href="{G_TEMPLATES_CSS}/mobile/comm.css" rel="stylesheet" type="text/css" />
<link href="{G_TEMPLATES_CSS}/mobile/member.css" rel="stylesheet" type="text/css" />
<link href="{G_TEMPLATES_CSS}/mobile/invite.css" rel="stylesheet" type="text/css" />
<link href="{G_TEMPLATES_CSS}/mobile/weui.min.css" rel="stylesheet" type="text/css" />
<link href="{G_TEMPLATES_CSS}/mobile/jquery-weui.min.css" rel="stylesheet" type="text/css" />
<script src="{G_TEMPLATES_JS}/mobile/jquery190.js" language="javascript" type="text/javascript"></script>
<script src="{G_TEMPLATES_JS}/layer_mobile/layer.js" language="javascript" type="text/javascript"></script>
</head>
<body>
<div class="h5-1yyg-v1" id="loadingPicBlock">
  <div class="R-content" style="padding-top: 0px;">
    <div class="weui-cells">
      <div class="weui-cell" onClick="showinput()">
        <div class="weui-cell__hd"><img src="{G_TEMPLATES_IMAGE}/add1.png" style="width: 15px;"></div>
        <div class="weui-cell__bd">
          <p>绑定手机号码</p>
        </div>
        <div class="weui-cell__ft">></div>
      </div>
    </div>
    <div id="divSQTX" class="Apply-con">
      <table border="1" id="tb">
        <tr>
          <th>日期</th>
          <th>手机号</th>
        </tr>
      </table>
    </div>
    <style>
#divSQTX span {color: #dc332d}
table{border-collapse:collapse;border-spacing:0;margin:0;padding:0;border:none;text-align: center;width:100%}
table td{word-break: break-all; word-wrap:break-word;}
tr{height: 30px;}
th{width: 50%;}
.weui-label{width:60px}
.btn{text-align: center;width: 85%;border: 1px solid #ccc;border-radius: 5px;margin: 15px auto;height: 40px;font-size: 20px;line-height: 40px;color: white;background-color: #BBBBBB;}
.weui-input{font-size: 16px;text-align:center}
.phone_num_p{border: 1px solid #ccc;box-sizing: border-box;padding: 10px 0px;width: 90%;margin: 10px auto;border-radius: 5px;}
.phone_code{border: 1px solid #ccc;width: 50%;margin: 10px auto;border-radius: 5px;padding: 13px 10px; font-size:16px;text-align: center;}
.codebtn{width: 40%;padding: 14px 12px;background-color: orange;border-radius: 5px;font-size: 14px;margin-left: 10px;color: white;}
.orange,.Progress-bar .Pro-bar-li li.P-bar01 em,.Progress-bar .Pro-bar-li li.P-bar03 em {color: {THEME_COLOR};}a.orgBtn,.u-progress .pging,.haveNot .guangguang,#addAll,#addAll p {background: {THEME_COLOR};}#addAll {box-shadow: 0 0 15px {THEME_COLOR};}
</style>
  </div>
</div>
<div style="height:70px;"></div>
{wc:templates "mobile/index","footer"}
<script language="javascript" type="text/javascript">
	var coderestsecode=0;
		var Path = new Object();
		Path.Skin = "{G_TEMPLATES_STYLE}";
		Path.Webpath = "{WEB_PATH}";
		var Base = {
			head: document.getElementsByTagName("head")[0] || document.documentElement,
			Myload: function (B, A) {
				this.done = false;
				B.onload = B.onreadystatechange = function () {
					if (!this.done && (!this.readyState || this.readyState === "loaded" || this.readyState === "complete")) {
						this.done = true;
						A();
						B.onload = B.onreadystatechange = null;
						if (this.head && B.parentNode) {
							this.head.removeChild(B)
						}
					}
				}
			},
			getScript: function (A, C) {
				var B = function () {};
				if (C != undefined) {
					B = C
				}
				var D = document.createElement("script");
				D.setAttribute("language", "javascript");
				D.setAttribute("type", "text/javascript");
				D.setAttribute("src", A);
				this.head.appendChild(D);
				this.Myload(D, B)
			},
			getStyle: function (A, B) {
				var B = function () {};
				if (callBack != undefined) {
					B = callBack
				}
				var C = document.createElement("link");
				C.setAttribute("type", "text/css");
				C.setAttribute("rel", "stylesheet");
				C.setAttribute("href", A);
				this.head.appendChild(C);
				this.Myload(C, B)
			}
		}

		function GetVerNum() {
			var D = new Date();
			return D.getFullYear().toString().substring(2, 4) + '.' + (D.getMonth() + 1) + '.' + D.getDate() + '.' + D.getHours() +
				'.' + (D.getMinutes() < 10 ? '0' : D.getMinutes().toString().substring(0, 1))
		}
		Base.getScript('{G_TEMPLATES_JS}/mobile/Bottom.js?v=' + GetVerNum());
		function showinput() {
			var html = '<div class="weui-cell phone_num_p">' +
				'<div class="weui-cell__bd ">' +
				'<input class="weui-input phone_num" type="number" pattern="(\d{11})|^((\d{7,8})|(\d{4}|\d{3})-(\d{7,8})|(\d{4}|\d{3})-(\d{7,8})-(\d{4}|\d{3}|\d{2}|\d{1})|(\d{7,8})-(\d{4}|\d{3}|\d{2}|\d{1}))$" placeholder="请输入手机号">' +
				'</div>' +
				'</div>' +
				'<div style="padding: 0px 15px;border-bottom: 1px solid #ececec;width: 90%;margin: 0px auto;">'+
				'<input type="text" class="phone_code" placeholder="请输入验证码"><span class="codebtn" onclick="sendcode()">获取验证码</span></div>'+
				'<div class="btn" onclick="onsave()">确认绑定</div>'
				;
			layer.open({
				type: 1,
				content: html,
				anim: 'up',
				style:"padding-top:20px;width:90%;border-radius: 6px;",
			});
		}
		function onsave(){
			var content={};
			content.phone_num=$(".phone_num").val();
			content.code=$(".phone_code").val();
			if(!isPoneAvailable($(".phone_num"))){
				alert('请输入正确的手机号');
				return;
			}
			if(content.phone_num==''||content.code==''){
				alert('请输入手机号和验证码');
				return;
			}
			$.post("{WEB_PATH}/mobile/home/addbindphone",{content:content},function(data){
				if(data.status=="ok"){
					coderestsecode=Date.parse(new Date());
					alert('绑定成功');
					location.reload();
				}else{
					alert(data.data);
				}
			},'json');
		}

		function onload() {
			$.post("{WEB_PATH}/mobile/home/getbindphonelist", {}, function (data) {
				if (data.status == "ok") {
					data = data.data;
					for (var i in data) {
						var html = "<tr>" +
							"<td>"+data[i].intime+"</td>" +
							"<td>"+data[i].phone+"</td>" +
							"</tr>";
						$("#tb").append(html);
					}
				} else {
					alert(data.data);
				}
			}, 'json');
		}
		function sendcode(){
			if(!isPoneAvailable($(".phone_num"))){
				alert('请输入正确的手机号');
				return;
			}
			if(Date.parse(new Date())-coderestsecode<60000){
				alert('发送时间太频繁，请稍后再试');
				return;
			}
			$.post("{WEB_PATH}/mobile/home/sendcode",{phone_num:$(".phone_num").val()},function(data){
				if(data.status=="ok"){
					coderestsecode=Date.parse(new Date());
					alert('发送成功');
				}else{
					alert(data.data);
				}
			},'json');
		}
		//验证手机号
		function isPoneAvailable($poneInput) {
            var myreg=/^[1][3,4,5,7,8][0-9]{9}$/;
            if (!myreg.test($poneInput.val())) {
                return false;
            } else {
                return true;
            }
        }
		onload();
	</script>
</div>
</body>
</html>
<SCRIPT Language=VBScript></SCRIPT>
