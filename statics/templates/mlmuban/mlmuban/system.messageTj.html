            title: '{wc:$string}',
            type: '{wc:$iserror}',
            timer: 1500
        }).then(function(isConfirm) {
            if (isConfirm === true) {
                location.href="{wc:$defurl}";
            } else if (isConfirm === false) {

            } else {
                // Esc, close button or outside click
                // isConfirm is undefined
            }
        });
        setTimeout(()=>{
            location.href="{wc:$defurl}";
        },1500)
    },100)
</script>
