<script type="text/javascript">$(function(){
	// 账号：手机号 11 位 或 邮箱 20 位，通过时显示右侧打勾
	var phoneOrEmail = function(val){
		val = $.trim(val);
		if (!val) return;
		if (/^\d{11}$/.test(val)) return true;
		if (/^[\w.-]+@[\w.-]+\.\w+$/.test(val) && val.length <= 20) return true;
		return false;
	};
	var demo=$(".registerform").Validform({
		tiptype:2,
		datatype: { "phoneOrEmail": phoneOrEmail }
	});
	// 将提示与正确/错误状态都移入输入框内 overlay，并彻底隐藏下方 .ts
	$(".login_box .registerform [datatype]").each(function(){
		var inp=$(this), wrap=inp.closest(".login-input-cell"), tsWrap=wrap.next(".ts"), tipCell=tsWrap.find(".Validform_checktip"), inner=wrap.find(".login-tip-inner"), textSpan=inner.find(".login-tip-text"), icon=inner.find(".login-tip-icon"), rightIcon=wrap.find(".login-tip-right");
		if(!tipCell.length||!inner.length) return;
		function sync(){
			var isRight=tipCell.hasClass("Validform_right"), isWrong=tipCell.hasClass("Validform_wrong"), isLoading=tipCell.hasClass("Validform_loading");
			rightIcon.removeClass("show");
			inner.removeClass("show wrong");
			icon.removeClass("show");
			inp.removeClass("tip-visible");
			textSpan.text("");
			tipCell.text("");
			tsWrap.addClass("login-ts-hidden");
			if(isRight){
				rightIcon.addClass("show");
			}
			else if(isWrong){
				icon.addClass("show");
			}
			else if(isLoading){
				// 不显示“正在检测…”等文案，仅保留后续的打勾/错误图标
			}
		}
		sync();
		inp.on("blur",function(){ setTimeout(sync,50); });
		// 仅监听 tip 的 class 变化（校验状态），不监听文案内容变化，避免卡顿
		var mo=typeof MutationObserver!=="undefined"&&new MutationObserver(function(){ sync(); });
		if(mo){ mo.observe(tipCell[0],{attributes:true,attributeFilter:["class"]}); }
	});
	// 账号输入框：输入时实时校验，通过则显示右侧打勾
	var accountInp = $("#LoginForm input[name=\"username\"]");
	if (accountInp.length) {
		var wrap = accountInp.closest(".login-input-cell"), tsWrap = wrap.next(".ts"), tipCell = tsWrap.find(".Validform_checktip"), rightIcon = wrap.find(".login-tip-right");
		function accountSync(valid) {
			tipCell.removeClass("Validform_right Validform_wrong Validform_loading");
			rightIcon.removeClass("show");
			if (valid) { tipCell.addClass("Validform_right"); rightIcon.addClass("show"); }
		}
		accountInp.on("input", function() {
			var val = $.trim($(this).val());
			accountSync(phoneOrEmail(val) === true);
		});
	}
	$(".login_box .login-field .ts").addClass("login-ts-hidden");
})</script>
<script type="text/javascript">
// 四个小角色所有瞳孔都随鼠标方向轻微移动（监听整页鼠标移动）
$(function(){
	function bindEyeTracking($banner){
		if(!$banner.length) return;
		var $pupils = $banner.find(".login-characters .pupil");
		if(!$pupils.length) return;
		var maxOffset = 5;
		$(window).on("mousemove.loginEyes", function(e){
			var rect = $banner[0].getBoundingClientRect();
			var cx = rect.left + rect.width / 2;
			var cy = rect.top + rect.height / 2;
			var nx = (e.clientX - cx) / (rect.width / 2);
			var ny = (e.clientY - cy) / (rect.height / 2);
			nx = Math.max(-1, Math.min(1, nx));
			ny = Math.max(-1, Math.min(1, ny));
			var tx = nx * maxOffset;
			var ty = ny * maxOffset;
			$pupils.css("transform", "translate(" + tx + "px," + ty + "px)");
		});
	}
	bindEyeTracking($(".login_banner_21st"));
});
</script>

<script type="text/javascript">
$("#sendsms").click(function(){
	var mobile=$("input[name='mobile']").val();
	var captcha=$("input[name='captcha']").val();
	if(mobile==''){
		toast("{wc:fun:lan('fillaccount','请填写手机号！')}", "error");
		return false;
	}
	if(captcha==''){
		toast("{wc:fun:lan('enterverification','请输入验证码！')}", "error");
		return false;
	}
	$.post("{wc:WEB_PATH}/app/user/send_logincode",{phone:mobile},function(data){
		console.log(data);
		data = JSON.parse(data);
		if(data.status==200){
			toast("{wc:fun:lan('sendsuccess','发送成功！')}", "success");
		}else{
			toast("{wc:fun:lan('sendfail','发送失败！')}", "error");
		}
	});
})
$("#checkcode").attr("data",$("#checkcode").attr("src"));
$("#checkcode").click(function(){
	$(this).attr("src",$(this).attr("data")+"&="+new Date().getTime());
});
</script>
